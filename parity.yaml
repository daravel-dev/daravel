# Laravel ⇄ Daravel parity table (BLUEPRINT_V2 §16.5, ADR-016).
#
# Machine-readable map of Laravel 12 APIs to their Daravel equivalents,
# shared by the framework, the generated side-by-side docs and `daragic`.
# `symbol` is verified by packages/daravel/test/architecture/parity_test.dart:
#   Class            a public class, mixin, enum or extension type
#   Class.member     a member declared on it or inherited (extends/with/implements)
#   function         a top-level function or variable
# Regenerate the docs page with `dart run tool/docs/generate.dart`.

parityVersion: 1
laravel: "12.x"
daravel: "1.x"

sections:
  - name: Routing
    symbols:
      - { php: "Route::get($uri, $action)", dart: "router.get(path, handler)", symbol: Router.get }
      - { php: "Route::post / put / patch / delete", dart: "router.post / put / patch / delete", symbol: Router.post }
      - { php: "Route::match($methods, ...)", dart: "router.match(methods, path, handler)", symbol: Router.match }
      - { php: "Route::any(...)", dart: "router.any(path, handler)", symbol: Router.any }
      - { php: "Route::redirect($from, $to)", dart: "router.redirect(from, to)", symbol: Router.redirect }
      - { php: "Route::fallback(...)", dart: "router.fallback(handler)", symbol: Router.fallback }
      - { php: "Route::middleware(...)->prefix(...)->group(...)", dart: "router.group((r) {...}, prefix:, middleware:)", symbol: Router.group }
      - { php: "Route::apiResource('photos', PhotoController::class)", dart: "router.apiResource('photos', PhotoController())", symbol: Router.apiResource }
      - { php: "Route::resource(...)", dart: "router.resource(name, controller)", symbol: Router.resource }
      - { php: "->name('users.show')", dart: ".name('users.show')", symbol: RouteEntry.name }
      - { php: "->middleware(['auth'])", dart: ".middleware(const ['auth'])", symbol: RouteEntry.middleware }
      - { php: "->where('id', '[0-9]+') / ->whereNumber('id')", dart: ".where('id', r'\\d+') / .whereNumber('id')", symbol: RouteEntry.whereNumber }
      - { php: "->whereUuid('id')", dart: ".whereUuid('id')", symbol: RouteEntry.whereUuid }
      - { php: "public function store(StorePostRequest $request)", dart: ".validates(const StorePostRequest())", symbol: RouteEntry.validates, note: "Validated before the handler; read with request.validated()." }
      - { php: "$request->validated()", dart: "request.validated()", symbol: Request.validated }
      - { php: "(Scribe / Scramble response annotations)", dart: ".returns(schema, name:, shape:)", symbol: RouteEntry.returns, note: "Used by dartisan openapi:generate." }
      - { php: "route('users.show', ['id' => 1])", dart: "router.url('users.show', {'id': 1})", symbol: Router.url }

  - name: Requests & responses
    symbols:
      - { php: "$request->validate($rules)", dart: "await request.validate(rules)", symbol: Request.validate, async: true }
      - { php: "$request->all()", dart: "await request.all()", symbol: Request.all, async: true }
      - { php: "$request->input('a.b')", dart: "await request.input<T>('a.b')", symbol: Request.input, async: true }
      - { php: "$request->has('key')", dart: "await request.has('key')", symbol: Request.has, async: true }
      - { php: "$request->integer('page', 1)", dart: "await request.integer('page', 1)", symbol: Request.integer, async: true }
      - { php: "$request->boolean('remember')", dart: "await request.boolean('remember')", symbol: Request.boolean, async: true }
      - { php: "$request->float('price') / ->string('name')", dart: "await request.float('price') / .string('name')", symbol: Request.float, async: true }
      - { php: "$request->query('page')", dart: "request.query['page']", symbol: Request.query }
      - { php: "$request->query() (ids[]=1&ids[]=2)", dart: "request.queryInput", symbol: Request.queryInput, note: "Brackets build lists and maps, as PHP parse_str." }
      - { php: "$request->query->getInt('page', 1)", dart: "request.queryInt('page', 1) / queryDouble / queryBool / queryString", symbol: Request.queryInt, note: "Synchronous: the query string is in memory." }
      - { php: "$request->header('x-id')", dart: "request.header('x-id')", symbol: Request.header }
      - { php: "$request->file('avatar') / hasFile('avatar')", dart: "await request.file('avatar') / hasFile('avatar')", symbol: Request.file, async: true, note: "Multipart bodies stream to temporary files." }
      - { php: "$file->store('avatars', 'public') / storeAs(...)", dart: "await file.store('avatars', disk: 'public')", symbol: UploadedFile.store, async: true }
      - { php: "UploadedFile::fake()->image('a.png')", dart: "UploadedFile.fake.image('a.png')", symbol: UploadedFile.fake }
      - { php: "$request->bearerToken()", dart: "request.bearerToken()", symbol: Request.bearerToken }
      - { php: "$request->ip()", dart: "request.ip", symbol: Request.ip }
      - { php: "$request->url()", dart: "request.url", symbol: Request.url }
      - { php: "$request->route('id')", dart: "request.param<int>('id')", symbol: Request.param }
      - { php: "$request->expectsJson()", dart: "request.expectsJson", symbol: Request.expectsJson }
      - { php: "response()->json($data, $status)", dart: "Response.json(data, status: status)", symbol: Response.json }
      - { php: "Blade views ({{ $name }}, {!! $html !!})", dart: "div([user.name]) / raw(html) from package:daravel/html.dart", symbol: HtmlNode, note: "Typed builder, escaped by default; a separate import." }
      - { php: "response()->noContent()", dart: "Response.noContent()", symbol: Response.noContent }
      - { php: "redirect($to)", dart: "Response.redirect(to)", symbol: Response.redirect }
      - { php: "response()->streamDownload(...)", dart: "Response.stream(...)", symbol: Response.stream }
      - { php: "abort(404, $message)", dart: "abort(404, message)", symbol: abort, note: "Without a message the JSON message is empty, as in Laravel." }
      - { php: "class StoreUserRequest extends FormRequest", dart: "final class StoreUserRequest extends FormRequest", symbol: FormRequest }

  - name: Validation
    symbols:
      - { php: "Validator::make($data, $rules)", dart: "Validator(data, rules)", symbol: Validator }
      - { php: "$validator->fails()", dart: "await validator.fails()", symbol: Validator.fails, async: true }
      - { php: "$validator->validate()", dart: "await validator.validate()", symbol: Validator.validate, async: true }
      - { php: "ValidationException", dart: "ValidationException", symbol: ValidationException }
      - { php: "Rule::in([...]) / Rule::unique('users')", dart: "Rules.inList([...]) / Rules.unique('users')", symbol: Rules }
      - { php: "['required', 'email', 'max:255']", dart: "Rules.required().email().max(255)", symbol: RuleBuilder, note: "Chained rule objects, checked by the compiler." }

  - name: Eloquent
    symbols:
      - { php: "class User extends Model", dart: "final class User extends Model", symbol: Model }
      - { php: "protected $table / $fillable / $hidden / $casts", dart: "ModelDefinition<User>(table:, fillable:, hidden:, casts:)", symbol: ModelDefinition }
      - { php: "$model->getMorphClass()", dart: "Relation.morphClassOf(User.definition)", symbol: Relation.morphClassOf, note: "The morph alias, else `ModelDefinition.morphClass` (`App\\Models\\User` by default)." }
      - { php: "User::query()", dart: "User.query()", symbol: ModelDefinition.query }
      - { php: "User::where('a', $b)->first()", dart: "await User.query().where('a', b).first()", symbol: ModelQuery.where, async: true }
      - { php: "User::find($id) / findOrFail($id)", dart: "await User.query().find(id) / findOrFail(id)", symbol: ModelQuery.findOrFail, async: true, throws: ModelNotFoundException }
      - { php: "->firstOrFail()", dart: ".firstOrFail()", symbol: ModelQuery.firstOrFail, async: true, throws: ModelNotFoundException }
      - { php: "User::create($attributes)", dart: "await User.query().create(attributes)", symbol: ModelQuery.create, async: true }
      - { php: "User::firstOrCreate / updateOrCreate", dart: "firstOrCreate / updateOrCreate", symbol: ModelQuery.updateOrCreate, async: true }
      - { php: "->with(['posts'])", dart: ".with_(['posts'])", symbol: ModelQuery.with_, note: "`with` is a reserved word in Dart." }
      - { php: "->withCount('posts')", dart: ".withCount('posts')", symbol: ModelQuery.withCount }
      - { php: "->withSum('orders', 'total') / withAvg / withMin / withMax / withExists", dart: ".withSum('orders', 'total') / withAvg / withMin / withMax / withExists", symbol: ModelQuery.withExists }
      - { php: "->whereHas('posts', fn)", dart: ".whereHas('posts', (q) {...})", symbol: ModelQuery.whereHas }
      - { php: "->whereHas('posts.comments', fn) / whereDoesntHave / orWhereHas", dart: ".whereHas('posts.comments', (q) {...})", symbol: ModelQuery.orWhereDoesntHave, note: "Nested relations become nested EXISTS, as in Laravel." }
      - { php: "->whereHasMorph('commentable', [Post::class], fn)", dart: ".whereHasMorph('commentable', [Post.definition], (q, type) {...})", symbol: ModelQuery.whereHasMorph }
      - { php: "$this->hasOneThrough(Owner::class, Car::class)", dart: "HasOneThrough<Owner>(() => Owner.definition, through: () => Car.definition, firstKey: 'mechanic_id', secondKey: 'car_id')", symbol: HasOneThrough }
      - { php: "$this->morphMany(Comment::class, 'commentable')", dart: "MorphMany<Comment>(() => Comment.definition, morphName: 'commentable')", symbol: MorphMany }
      - { php: "$this->morphOne(Image::class, 'imageable')", dart: "MorphOne<Image>(() => Image.definition, morphName: 'imageable')", symbol: MorphOne }
      - { php: "$this->morphTo()", dart: "MorphTo(types: [() => Post.definition, () => Video.definition])", symbol: MorphTo, note: "No reflection: possible targets come from `types:` or the morph map." }
      - { php: "$this->morphToMany(Tag::class, 'taggable') / morphedByMany", dart: "MorphToMany<Tag>(..., morphName: 'taggable', relatedPivotKey: 'tag_id') / MorphedByMany", symbol: MorphedByMany }
      - { php: "Relation::morphMap([...]) / enforceMorphMap([...])", dart: "Relation.morphMap({'post': () => Post.definition}) / enforceMorphMap", symbol: Relation.enforceMorphMap }
      - { php: "->paginate(15)", dart: "await query.paginate(perPage: 15)", symbol: ModelQuery.paginate, async: true, note: "Page and path come from the current request, like Laravel." }
      - { php: "->simplePaginate() / cursorPaginate()", dart: ".simplePaginate() / .cursorPaginate()", symbol: ModelQuery.cursorPaginate, async: true }
      - { php: "->latest() / oldest()", dart: ".latest() / .oldest()", symbol: ModelQuery.latest }
      - { php: "->withTrashed() / onlyTrashed()", dart: ".withTrashed() / .onlyTrashed()", symbol: ModelQuery.withTrashed }
      - { php: "$model->save() / update() / delete()", dart: "await model.save() / update() / delete()", symbol: Model.save, async: true }
      - { php: "$model->restore() / forceDelete()", dart: "await model.restore() / forceDelete()", symbol: Model.restore, async: true }
      - { php: "$model->isDirty() / wasChanged()", dart: "model.isDirty() / wasChanged()", symbol: Model.isDirty }
      - { php: "$model->refresh() / fresh()", dart: "await model.refresh() / fresh()", symbol: Model.refresh, async: true }
      - { php: "$model->load('posts')", dart: "await model.load('posts')", symbol: Model.load, async: true }
      - { php: "$model->toArray() / toJson()", dart: "model.toJson()", symbol: Model.toJson }
      - { php: "ModelNotFoundException", dart: "ModelNotFoundException", symbol: ModelNotFoundException }

  - name: Database
    symbols:
      - { php: "DB::table('users')", dart: "DB.table('users')", symbol: DB.table }
      - { php: "DB::select($sql, $bindings)", dart: "await DB.select(sql, bindings)", symbol: DB.select, async: true }
      - { php: "DB::statement($sql)", dart: "await DB.statement(sql)", symbol: DB.statement, async: true }
      - { php: "DB::transaction(fn)", dart: "await DB.transaction(() async {...})", symbol: DB.transaction, async: true }
      - { php: "DB_CONNECTION=mysql / mariadb", dart: "withDatabaseDriver('mysql', MySqlDriver.fromConfig)", symbol: ApplicationBuilder.withDatabaseDriver, note: "package:daravel_mysql; registered by new projects." }
      - { php: "DB::raw($sql)", dart: "DB.raw(sql)", symbol: DB.raw }
      - { php: "DB::listen(fn (QueryExecuted $q) => ...)", dart: "DB.listen((QueryExecuted q) {...})", symbol: DB.listen }
      - { php: "DB::whenQueryingForLongerThan(500, fn)", dart: "DB.whenQueryingForLongerThan(const Duration(milliseconds: 500), (q) {...})", symbol: DB.whenQueryingForLongerThan, note: "Total per request, job or command; once." }
      - { php: "DB::enableQueryLog(); ... count(DB::getQueryLog())", dart: "final (result, count, queries) = await DB.withQueryCount(() => ...)", symbol: DB.withQueryCount }
      - { php: "->whereToday('starts_at') / wherePast / whereFuture / whereBeforeToday", dart: ".whereToday('starts_at') / wherePast / whereFuture / whereBeforeToday", symbol: QueryBuilder.whereToday, note: "Against Clock.now()." }
      - { php: "->insertGetId($values)", dart: "await DB.table(t).insertGetId(values)", symbol: QueryBuilder.insertGetId, async: true }
      - { php: "->upsert($values, $uniqueBy)", dart: ".upsert(values, uniqueBy)", symbol: QueryBuilder.upsert, async: true }
      - { php: "->chunkById(100, fn)", dart: ".chunkById(100, (rows) async {...})", symbol: QueryBuilder.chunkById, async: true }
      - { php: "->toSql() / toRawSql()", dart: ".toSql() / .toRawSql()", symbol: QueryBuilder.toRawSql }
      - { php: "->selectSub($query, 'alias')", dart: ".selectSub(query, 'alias')", symbol: QueryBuilder.selectSub }

  - name: Schema & migrations
    symbols:
      - { php: "->selectSub($query, 'alias')", dart: ".selectSub(query, 'alias')", symbol: QueryBuilder.selectSub }
      - { php: "Schema::create('users', fn (Blueprint $table) => ...)", dart: "schema.create('users', (table) {...})", symbol: SchemaBuilder.create, async: true }
      - { php: "Schema::table / dropIfExists / hasTable / hasColumn", dart: "schema.table / dropIfExists / hasTable / hasColumn", symbol: SchemaBuilder.hasColumn, async: true }
      - { php: "$table->id() / string() / foreignId()->constrained()", dart: "table.id() / string() / foreignId().constrained()", symbol: Blueprint.foreignId }
      - { php: "$table->morphs('taggable') / nullableMorphs / uuidMorphs / ulidMorphs", dart: "table.morphs('taggable') / nullableMorphs / uuidMorphs / ulidMorphs", symbol: Blueprint.nullableMorphs }
      - { php: "$table->timestamps() / softDeletes() / rememberToken()", dart: "table.timestamps() / softDeletes() / rememberToken()", symbol: Blueprint.softDeletes }
      - { php: "return new class extends Migration { up / down }", dart: "final class CreateX extends Migration { up / down }", symbol: Migration }
      - { php: "class DatabaseSeeder extends Seeder", dart: "final class DatabaseSeeder extends Seeder", symbol: Seeder }
      - { php: "User::factory()->count(3)->create()", dart: "UserFactory().count(3).create()", symbol: ModelFactory }

  - name: Auth & security
    symbols:
      - { php: "auth()->user() / Auth::user()", dart: "await Auth.user()", symbol: Auth.user, async: true }
      - { php: "Auth::id() / check() / guest()", dart: "await Auth.id() / check() / guest()", symbol: Auth.check, async: true }
      - { php: "Auth::guard('api')", dart: "Auth.guard('api')", symbol: Auth.guard }
      - { php: "$user->createToken($name, $abilities)", dart: "await Auth.issueToken(user, name, abilities: [...])", symbol: Auth.issueToken, async: true }
      - { php: "$user->currentAccessToken()->delete()", dart: "await Auth.tokenGuard().revokeCurrent()", symbol: TokenGuard.revokeCurrent, async: true }
      - { php: "$user->tokenCan('posts:read')", dart: "await Auth.tokenGuard().tokenCan('posts:read')", symbol: TokenGuard.tokenCan, async: true }
      - { php: "Hash::make / check / needsRehash", dart: "await Hash.make / check, Hash.needsRehash", symbol: Hash.needsRehash }
      - { php: "Crypt::encryptString / decryptString", dart: "await Crypt.encryptString / decryptString", symbol: Crypt.decryptString, async: true, note: "Byte-compatible with APP_CIPHER=AES-256-CBC or AES-256-GCM." }
      - { php: "Crypt::encrypt / decrypt", dart: "await Crypt.encrypt / decrypt", symbol: Crypt.encrypt, async: true, note: "Values are JSON-encoded, not PHP-serialized: not cross-runtime." }
      - { php: "php artisan env:encrypt / env:decrypt", dart: "dartisan env:encrypt / env:decrypt", symbol: EnvironmentEncrypter, note: "Same .env.encrypted file (default and --readable); decrypted in memory at boot with DARAVEL_ENV_ENCRYPTION_KEY or LARAVEL_ENV_ENCRYPTION_KEY." }
      - { php: "Gate::define / allows / denies / authorize", dart: "Gate.define / allows / denies / authorize", symbol: Gate.authorize, async: true }
      - { php: "class PostPolicy", dart: "final class PostPolicy extends Policy<Post>", symbol: Policy }
      - { php: "RateLimiter::for('login', fn)", dart: "limiter.define('login', (request) => Limit.perMinute(5))", symbol: RateLimiter.define }
      - { php: "Limit::perMinute(60)->by($key)", dart: "Limit.perMinute(60).by(key)", symbol: Limit.by }

  - name: Cache, queue, events, scheduling
    symbols:
      - { php: "Cache::get / put / forget / has", dart: "await Cache.get / put / forget / has", symbol: Cache.put, async: true }
      - { php: "Cache::remember($key, $ttl, fn)", dart: "await Cache.remember(key, ttl, () async {...})", symbol: Cache.remember, async: true }
      - { php: "Cache::flexible($key, [$fresh, $stale], fn)", dart: "await Cache.flexible(...)", symbol: Cache.flexible, async: true }
      - { php: "Cache::lock('name', 10)->get(fn)", dart: "await Cache.lock('name', ...)", symbol: Cache.lock }
      - { php: "SendEmail::dispatch($user)", dart: "await Queue.dispatch(SendEmail(user))", symbol: Queue.dispatch, async: true }
      - { php: "Queue::later($delay, $job)", dart: "await Queue.later(delay, job)", symbol: Queue.later, async: true }
      - { php: "public function tags() (Horizon)", dart: "List<String> get tags", symbol: Job.tags }
      - { php: "php artisan queue:pause database:default / queue:continue", dart: "dartisan queue:pause database:default / queue:continue", symbol: QueueManager.pause }
      - { php: "class SendEmail implements ShouldQueue", dart: "final class SendEmail extends Job", symbol: Job }
      - { php: "event(new OrderShipped($order))", dart: "await Event.dispatch(OrderShipped(order))", symbol: Event.dispatch, async: true }
      - { php: "Event::listen(OrderShipped::class, fn)", dart: "Event.listen<OrderShipped>((e) async {...})", symbol: Event.listen }
      - { php: "Event::fake() / Queue::fake()", dart: "Event.fake() / Queue.fake()", symbol: Event.fake }
      - { php: "Schedule::command('reports:send')->daily()", dart: "schedule.command('reports:send').daily()", symbol: Schedule.command }
      - { php: "->everyFiveMinutes() / dailyAt('13:00')", dart: ".everyFiveMinutes() / .dailyAt('13:00')", symbol: ScheduledTask.dailyAt }
      - { php: "->withoutOverlapping() / onOneServer()", dart: ".withoutOverlapping() / .onOneServer()", symbol: ScheduledTask.withoutOverlapping }
      - { php: "->timezone('America/New_York')", dart: ".timezone('America/New_York')", symbol: ScheduledTask.timezone }

  - name: Resources, storage, logging, config
    symbols:
      - { php: "class UserResource extends JsonResource { toArray }", dart: "final class UserResource extends JsonResource<User> { toArray }", symbol: JsonResource.toArray }
      - { php: "UserResource::collection($users)", dart: "JsonResource.collection(users, UserResource.new)", symbol: JsonResource.collection }
      - { php: "->additional([...])", dart: ".additional({...})", symbol: JsonResource.additional }
      - { php: "$this->when($cond, $value) / whenLoaded('posts')", dart: "when(cond, value) / whenLoaded('posts')", symbol: JsonResource.whenLoaded }
      - { php: "public function with($request)", dart: "Map<String, Object?> withMeta(Request? request)", symbol: JsonResource.withMeta, note: "`with` is a reserved word in Dart." }
      - { php: "Storage::disk('public')->put($path, $contents)", dart: "await Storage.disk('public').put(path, contents)", symbol: Storage.disk }
      - { php: "Storage::url($path)", dart: "Storage.url(path)", symbol: Storage.url }
      - { php: "Http::withToken($t)->retry(3, 100)->post($url, $data)", dart: "await Http.withToken(t).retry(3).post(url, json: data)", symbol: Http.withToken, async: true }
      - { php: "Http::fake([...]) / Http::assertSent(...)", dart: "Http.fake({...}).assertSent(...)", symbol: Http.fake }
      - { php: "php artisan down --secret / up", dart: "dartisan down --secret / up", symbol: PreventRequestsDuringMaintenance, note: "Same storage/framework/down file; bypass cookie daravel_maintenance." }
      - { php: "Log::info($message, $context)", dart: "Log.info(message, context)", symbol: Log.info }
      - { php: "Log::withContext([...])", dart: "Log.withContext({...})", symbol: Log.withContext }
      - { php: "config('app.name')", dart: "Config.get<String>('app.name')", symbol: Config.get }
      - { php: "app(Service::class)", dart: "App.make<Service>()", symbol: App.make }
      - { php: "resolve(Service::class)", dart: "inject<Service>() / maybeInject<Service>()", symbol: inject, note: "The type is inferred where the value goes: `orders ?? inject()`." }
      - { php: "$this->app->singleton(...) in AppServiceProvider::register()", dart: ".withBindings((c) => c.singleton((c) => OrderService(c(), c())))", symbol: ApplicationBuilder.withBindings, note: "Calling the container (`c()`) resolves the type each argument needs." }
      - { php: "now()", dart: "Clock.now()", symbol: Clock.now, note: "Frozen by freezeTime()/travel() in tests." }

  - name: Strings, helpers, collections
    symbols:
      - { php: "Str::slug / snake / camel / studly / kebab / title / headline", dart: "Str.slug / snake / camel / studly / kebab / title / headline", symbol: Str.headline }
      - { php: "Str::limit / words / mask / squish", dart: "Str.limit / words / mask / squish", symbol: Str.mask }
      - { php: "Str::after / before / between / start / finish", dart: "Str.after / before / between / start / finish", symbol: Str.between }
      - { php: "Str::contains / startsWith / endsWith", dart: "Str.contains / startsWith / endsWith", symbol: Str.contains }
      - { php: "Str::plural / singular / pluralStudly", dart: "Str.plural / singular / pluralStudly", symbol: Str.pluralStudly, note: "English rules with common irregulars." }
      - { php: "Str::random / uuid / ulid / isUuid / isJson", dart: "Str.random / uuid / ulid / isUuid / isJson", symbol: Str.ulid }
      - { php: "Str::of($title)->after(':')->squish()->slug()", dart: "title.after(':').squish().slug()", symbol: DaravelString, note: "Str methods chain on the string itself." }
