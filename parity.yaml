      - { php: "$date->diffForHumans() / isPast() / isToday() / startOfDay()", dart: "date.diffForHumans() / isPast / isToday / startOfDay", symbol: DaravelDateTime, note: "Carbon's units and wording, en and id." }
      - { php: "$date->addMonth() / addMonthsNoOverflow(1) / startOfWeek() / between($a, $b)", dart: "date.addMonths(1) / addMonthsNoOverflow(1) / startOfWeek / isBetween(a, b)", symbol: DaravelDateTime, note: "Same overflow rules as Carbon." }
      - { php: "Context::add('tenant_id', $id) / Context::get('tenant_id') / addHidden", dart: "Context.add('tenant_id', id) / Context.get<int>('tenant_id') / addHidden", symbol: Context, note: "Logged, and carried into queued jobs." }
      - { php: "Number::format / percentage / currency / fileSize / abbreviate / ordinal", dart: "Number.format / percentage / currency / fileSize / abbreviate / ordinal", symbol: Number, note: "en and id locales, as Laravel's intl output." }
      - { php: "abort_if / abort_unless", dart: "abortIf / abortUnless", symbol: abortIf }
