      - { php: "rescue(fn, )", dart: "await rescue(() async {...}, fallback:)", symbol: rescue, async: true }
      - { php: "once(fn)", dart: "once(key, () => ...)", symbol: once, note: "Keyed explicitly; memoized per request/job/command scope." }
      - { php: "blank / filled / tap / value / data_get", dart: "blank / filled / tap / value / dataGet", symbol: dataGet }
      - { php: "now() / today()", dart: "now() / today()", symbol: today }
      - { php: "collect($rows)->pluck('email')", dart: "rows.pluck('email')", symbol: DaravelIterable.pluck, note: "Extensions on Iterable: no conversion to a Collection." }
      - { php: "->keyBy / groupBy / chunk / unique", dart: ".keyBy / groupBy / chunk / unique", symbol: DaravelIterable.groupBy }
      - { php: "->sum / avg / sortBy / sortByDesc / partition", dart: ".sumBy / avgBy / sortBy / sortByDesc / partition", symbol: DaravelIterable.partition }

  - name: Testing
    symbols:
