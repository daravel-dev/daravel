# Laravel ⇄ Daravel parity table (BLUEPRINT_V2 §16.5, ADR-016).
#
# Machine-readable map of Laravel 12 APIs to their Daravel equivalents,
# shared by the framework, the generated side-by-side docs and `daragic`.
# `symbol` is verified by packages/daravel/test/architecture/parity_test.dart:
#   Class            a public class, mixin, enum or extension type
#   Class.member     a member declared on it or inherited (extends/with/implements)
#   function         a top-level function or variable
# Regenerate the docs page with `dart run tool/docs/generate.dart`.

parityVersion: 1
laravel: "12.x"
daravel: "1.x"

sections:
  - name: Routing
    symbols:
      - { php: "Route::get($uri, $action)", dart: "router.get(path, handler)", symbol: Router.get }
      - { php: "Route::post / put / patch / delete", dart: "router.post / put / patch / delete", symbol: Router.post }
      - { php: "Route::match($methods, ...)", dart: "router.match(methods, path, handler)", symbol: Router.match }
      - { php: "Route::any(...)", dart: "router.any(path, handler)", symbol: Router.any }
      - { php: "Route::redirect($from, $to)", dart: "router.redirect(from, to)", symbol: Router.redirect }
      - { php: "Route::fallback(...)", dart: "router.fallback(handler)", symbol: Router.fallback }
      - { php: "Route::middleware(...)->prefix(...)->group(...)", dart: "router.group((r) {...}, prefix:, middleware:)", symbol: Router.group }
      - { php: "Route::apiResource('photos', PhotoController::class)", dart: "router.apiResource('photos', PhotoController())", symbol: Router.apiResource }
      - { php: "Route::resource(...)", dart: "router.resource(name, controller)", symbol: Router.resource }
      - { php: "->name('users.show')", dart: ".name('users.show')", symbol: RouteEntry.name }
      - { php: "->middleware(['auth'])", dart: ".middleware(const ['auth'])", symbol: RouteEntry.middleware }
      - { php: "->where('id', '[0-9]+') / ->whereNumber('id')", dart: ".where('id', r'\\d+') / .whereNumber('id')", symbol: RouteEntry.whereNumber }
      - { php: "->whereUuid('id')", dart: ".whereUuid('id')", symbol: RouteEntry.whereUuid }
      - { php: "public function store(StorePostRequest $request)", dart: ".validates(const StorePostRequest())", symbol: RouteEntry.validates, note: "Validated before the handler; read with request.validated()." }
      - { php: "$request->validated()", dart: "request.validated()", symbol: Request.validated }
      - { php: "(Scribe / Scramble response annotations)", dart: ".returns(schema, name:, shape:)", symbol: RouteEntry.returns, note: "Used by dartisan openapi:generate." }
      - { php: "route('users.show', ['id' => 1])", dart: "router.url('users.show', {'id': 1})", symbol: Router.url }

  - name: Requests & responses
    symbols:
      - { php: "$request->validate($rules)", dart: "await request.validate(rules)", symbol: Request.validate, async: true }
      - { php: "$request->all()", dart: "await request.all()", symbol: Request.all, async: true }
      - { php: "$request->input('a.b')", dart: "await request.input<T>('a.b')", symbol: Request.input, async: true }
      - { php: "$request->merge([...])", dart: "await request.merge({...})", symbol: Request.merge, async: true }
      - { php: "$request->replace([...])", dart: "request.replace({...})", symbol: Request.replace }
      - { php: "$request->has('key')", dart: "await request.has('key')", symbol: Request.has, async: true }
      - { php: "$request->integer('page', 1)", dart: "await request.integer('page', 1)", symbol: Request.integer, async: true }
      - { php: "$request->boolean('remember')", dart: "await request.boolean('remember')", symbol: Request.boolean, async: true }
      - { php: "$request->float('price') / ->string('name')", dart: "await request.float('price') / .string('name')", symbol: Request.float, async: true }
      - { php: "$request->query('page')", dart: "request.query['page']", symbol: Request.query }
      - { php: "$request->query() (ids[]=1&ids[]=2)", dart: "request.queryInput", symbol: Request.queryInput, note: "Brackets build lists and maps, as PHP parse_str." }
      - { php: "$request->query->getInt('page', 1)", dart: "request.queryInt('page', 1) / queryDouble / queryBool / queryString", symbol: Request.queryInt, note: "Synchronous: the query string is in memory." }
      - { php: "$request->header('x-id')", dart: "request.header('x-id')", symbol: Request.header }
      - { php: "$request->file('avatar') / hasFile('avatar')", dart: "await request.file('avatar') / hasFile('avatar')", symbol: Request.file, async: true, note: "Multipart bodies stream to temporary files." }
      - { php: "$file->store('avatars', 'public') / storeAs(...)", dart: "await file.store('avatars', disk: 'public')", symbol: UploadedFile.store, async: true }
      - { php: "UploadedFile::fake()->image('a.png')", dart: "UploadedFile.fake.image('a.png')", symbol: UploadedFile.fake }
      - { php: "$request->bearerToken()", dart: "request.bearerToken()", symbol: Request.bearerToken }
      - { php: "$request->ip()", dart: "request.ip", symbol: Request.ip }
      - { php: "$request->url()", dart: "request.url", symbol: Request.url }
      - { php: "$request->route('id')", dart: "request.param<int>('id')", symbol: Request.param }
      - { php: "$request->expectsJson()", dart: "request.expectsJson", symbol: Request.expectsJson }
      - { php: "$request->cookie('theme') / ->cookies->all()", dart: "request.cookie('theme') / request.cookies", symbol: Request.cookie, note: "Decoded like $_COOKIE; EncryptCookies is not applied." }
      - { php: "response(...)->withCookie(cookie('theme', 'dark', 60))", dart: "response.withCookie('theme', 'dark', maxAge: Duration(minutes: 60))", symbol: Response.withCookie, note: "Same Set-Cookie text as Symfony's Cookie." }
      - { php: "response(...)->withoutCookie('theme') / Cookie::forget('theme')", dart: "response.withoutCookie('theme')", symbol: Response.withoutCookie }
      - { php: "response()->json($data, $status)", dart: "Response.json(data, status: status)", symbol: Response.json, note: "phpCompatible: true writes json_encode's bytes (\\/, \\u escapes, [] for an empty map)." }
      - { php: "Blade views ({{ $name }}, {!! $html !!})", dart: "div([user.name]) / raw(html) from package:daravel/html.dart", symbol: HtmlNode, note: "Typed builder, escaped by default; a separate import." }
      - { php: "response()->noContent()", dart: "Response.noContent()", symbol: Response.noContent }
      - { php: "redirect($to)", dart: "Response.redirect(to)", symbol: Response.redirect }
      - { php: "response()->streamDownload(...)", dart: "Response.stream(...)", symbol: Response.stream }
      - { php: "response()->eventStream(fn () => ...)", dart: "Response.sse(stream)", symbol: Response.sse, note: "Same frames and `</stream>` end event; adds heartbeats and ends on shutdown." }
      - { php: "new StreamedEvent(event: 'tick', data: $data)", dart: "SseEvent(data, event: 'tick')", symbol: SseEvent }
      - { php: "A custom WebSocket endpoint (outside Reverb channels)", dart: "router.ws('/ws/x', (socket, request) {...})", symbol: Router.ws, note: "A plain WebSocket after the route's middleware; Reverb and Pusher channels are under Broadcasting." }
      - { php: "abort(404, $message)", dart: "abort(404, message)", symbol: abort, note: "Without a message the JSON message is empty, as in Laravel." }
      - { php: "class StoreUserRequest extends FormRequest", dart: "final class StoreUserRequest extends FormRequest", symbol: FormRequest }

  - name: Mail and notifications
    symbols:
      - { php: "Mail::to($user)->send(new OrderShipped($order))", dart: "await Mail.to(user).send(OrderShipped(order))", symbol: Mail.to, async: true }
      - { php: "class OrderShipped extends Mailable (envelope, content, attachments)", dart: "final class OrderShipped extends Mailable", symbol: Mailable.envelope }
      - { php: "Mail::to($user)->queue(new OrderShipped) / later($delay, ...)", dart: "await Mail.to(user).queue(OrderShipped()) / later(delay, ...)", symbol: PendingMail.queue, async: true, note: "Rendered when queued; the job carries the message." }
      - { php: "class OrderShipped extends Mailable implements ShouldQueue", dart: "final class OrderShipped extends Mailable with ShouldQueue", symbol: ShouldQueue, note: "Also for notifications." }
      - { php: "Mail::fake(); Mail::assertSent(OrderShipped::class)", dart: "final mail = Mail.fake(); mail.assertSent<OrderShipped>()", symbol: MailFake.assertSent }
      - { php: "MAIL_MAILER=smtp / log / array", dart: "MAIL_MAILER=smtp / log / array", symbol: SmtpTransport, note: "Same keys as config/mail.php; MAIL_ENCRYPTION from Laravel 10 is read too." }
      - { php: "$user->notify(new InvoicePaid($invoice))", dart: "await user.notify(InvoicePaid(invoice))", symbol: Model.notify, async: true }
      - { php: "Notification::send($users, new InvoicePaid)", dart: "await Notifications.send(users, InvoicePaid())", symbol: Notifications.send, async: true, note: "Notifications, plural: Notification is the base class." }
      - { php: "Notification::route('mail', $address)->notify(...)", dart: "Notifications.route('mail', address).notify(...)", symbol: Notifications.route }
      - { php: "(new MailMessage)->line()->action()", dart: "NotificationMail().line().action()", symbol: NotificationMail.action }
      - { php: "$user->unreadNotifications / markAsRead()", dart: "user.notifications(unreadOnly: true) / Notifications.markAsRead(user)", symbol: Notifications.markAsRead, async: true }
      - { php: "php artisan make:notifications-table", dart: "CreateNotificationsTable()", symbol: CreateNotificationsTable, note: "Laravel's table; created only when missing." }
      - { php: "new Content(markdown: 'mail.orders.shipped')", dart: "MailContent(markdown: '...')", symbol: MailContent, note: "Markdown in Dart, not a Blade view; Laravel's default theme, inlined." }
      - { php: "<x-mail::button :url=\"$url\" color=\"success\">", dart: "mailButton(label, url, color: 'success')", symbol: mailButton, note: "The <x-mail::button> and <x-mail::panel> tags work in the markdown too." }
      - { php: "php artisan vendor:publish --tag=laravel-mail (theme CSS)", dart: ".withMailTheme((theme) => theme.copyWith(primary: '#4f46e5'))", symbol: MailTheme.copyWith }
      - { php: "via() => ['broadcast'] (BroadcastNotificationCreated)", dart: "via() => ['broadcast']", symbol: BroadcastChannel, note: "Same event, data and channel (private-App.Models.User.1): Echo's .notification() receives it." }

  - name: Broadcasting
    symbols:
      - { php: "php artisan reverb:start (Laravel Reverb)", dart: ".withBroadcasting(...) with REVERB_APP_ID / _KEY / _SECRET", symbol: PusherServer, note: "The Pusher protocol on the HTTP port; Laravel Echo and pusher-js connect unchanged." }
      - { php: "Broadcast::channel('orders.{id}', fn ($user, $id) => ...)", dart: "channels.channel('orders.{id}', (user, p) => ...)", symbol: ChannelRegistry.channel, note: "routes/channels.php: false refuses, true admits, a map is the presence member." }
      - { php: "class OrderShipped implements ShouldBroadcast", dart: "final class OrderShipped with ShouldBroadcast", symbol: ShouldBroadcast, note: "broadcastWith says what to send (no reflection); broadcast when dispatched." }
      - { php: "broadcast(new OrderShipped($order))->toOthers()", dart: "await Broadcast.event(OrderShipped(order).toOthers())", symbol: Broadcast.event, async: true }
      - { php: "BROADCAST_CONNECTION=reverb / pusher / log / null", dart: "BROADCAST_CONNECTION=daravel / reverb / pusher / log / null", symbol: BroadcastManager.send, async: true, note: "daravel: this server; reverb and pusher: their HTTP API, signed as pusher-php-server." }
      - { php: "Pusher HTTP API (POST /apps/{id}/events)", dart: "the same endpoints, signatures checked", symbol: PusherServer.events, async: true, note: "Laravel broadcasts through Daravel with BROADCAST_CONNECTION=reverb." }
      - { php: "Echo.channel('cache-prices') (Pusher cache channels)", dart: "Broadcast.send(..., ['cache-prices'], ...)", symbol: PusherServer.isCacheChannel, note: "The last event is kept 30 minutes for new subscribers." }
      - { php: "Echo.encryptedPrivate('orders.7') with encryption_master_key_base64", dart: "REVERB_ENCRYPTION_MASTER_KEY_BASE64", symbol: BroadcastConfig.encryptionMasterKey, note: "private-encrypted- channels, sealed with libsodium's secretbox." }
      - { php: "REVERB_SCALING_ENABLED=true (Reverb with Redis)", dart: "REVERB_SCALING_ENABLED=true (the database)", symbol: DatabaseBroadcastRelay, note: "Frames, presence members (here included) and cache channels span every server; PostgreSQL NOTIFY, MySQL polling." }
      - { php: "(Reverb's internal pub/sub)", dart: "await Broadcast.publish('orders.7', data)", symbol: Broadcast.publish, async: true, note: "Daravel's own channels between isolates, for custom WebSocket and SSE routes." }

  - name: Redis (daravel_redis)
    symbols:
      - { php: "Redis::command('HSET', [...])", dart: "await Redis.command(['HSET', ...])", symbol: Redis.command, async: true }
      - { php: "Redis::throttle('key')->allow(10)->every(60)->then(fn, fn)", dart: "await Redis.throttle('key').allow(10).every(const Duration(seconds: 60)).then(() {...}, (e) {...})", symbol: Redis.throttle, async: true, note: "Laravel's DurationLimiter script and key: both count against one limit." }
      - { php: "Redis::funnel('key')->limit(3)->then(fn, fn)", dart: "await Redis.funnel('key').limit(3).then(() {...}, (e) {...})", symbol: Redis.funnel, async: true, note: "Laravel's ConcurrencyLimiter script and slot keys." }
      - { php: "Redis::publish($channel, $message)", dart: "await Redis.publish(channel, message)", symbol: Redis.publish, async: true }
      - { php: "Redis::subscribe([...], fn ($message) => ...)", dart: "Redis.subscribe([...]).messages.listen(...)", symbol: Redis.subscribe, note: "Subscribes again after the connection drops." }
      - { php: "CACHE_STORE=redis", dart: "CACHE_STORE=redis with .withRedis()", symbol: RedisStore, note: "Numbers stored raw; cache:clear deletes the cache's keys, not the database (no FLUSHDB)." }
      - { php: "Cache::lock('report')->get(...) on Redis", dart: "Cache.lock('report') on CACHE_STORE=redis", symbol: RedisStore.acquireLock, async: true, note: "Laravel's RedisLock: the same keys and release script." }
      - { php: "QUEUE_CONNECTION=redis", dart: "QUEUE_CONNECTION=redis", symbol: RedisQueue, note: "BLPOP wakes idle workers; keys under daravel:, apart from Laravel's queues:." }
      - { php: "REVERB_SCALING_ENABLED=true (Redis)", dart: "REVERB_SCALING_DRIVER=redis", symbol: RedisBroadcastRelay, note: "Pub/Sub between servers; presence members shared across them." }

  - name: Sessions (daravel_session)
    symbols:
      - { php: "Route::middleware('web')", dart: ".group(routes, middleware: ['web'])", symbol: SessionApplicationBuilder, note: "withSession() registers encrypt_cookies, session and csrf, and the web group that runs them in Laravel's order." }
      - { php: "$request->session() / session()", dart: "request.session / Session.current", symbol: Session.current }
      - { php: "session()->get('key', $default) / put / has / forget", dart: "session.get<T>('key', fallback) / put / has / forget", symbol: Session.get, note: "Dot keys nest as in Laravel; stored as PHP serialize() with Laravel's _token, _flash and _previous keys." }
      - { php: "session()->flash('status', 'Saved') / reflash / keep / now", dart: "session.flash('status', 'Saved') / reflash / keep / now", symbol: Session.flash }
      - { php: "session()->regenerate() / invalidate()", dart: "await session.regenerate() / invalidate()", symbol: Session.invalidate, async: true }
      - { php: "csrf_token()", dart: "session.token", symbol: Session.token }
      - { php: "EncryptCookies middleware", dart: "EncryptCookiesMiddleware", symbol: EncryptCookiesMiddleware, note: "Crypt payload with CookieValuePrefix (hmac_sha1(name.'v2', key).'|'), so cookies are shared with the Laravel app." }
      - { php: "VerifyCsrfToken ($except, X-CSRF-TOKEN, X-XSRF-TOKEN)", dart: "VerifyCsrfTokenMiddleware(except: [...])", symbol: VerifyCsrfTokenMiddleware, note: "419 CSRF token mismatch.; the XSRF-TOKEN cookie is set on every response." }
      - { php: "SESSION_DRIVER=file|database", dart: "SESSION_DRIVER=file|database (array for tests)", symbol: SessionManager.extend, note: "Laravel's sessions table (payload base64(serialize()), last_activity) and file format; extend() adds a driver." }
      - { php: "create_sessions_table migration", dart: "CreateSessionsTable", symbol: CreateSessionsTable, note: "Does nothing when the table exists already." }

