name: Feature request
description: Propose an API, a Laravel feature to port, or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: How it would look in Daravel. If Laravel has it, link the Laravel docs.
      render: dart
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and the parity table (docs/guide/parity.md).
          required: true
