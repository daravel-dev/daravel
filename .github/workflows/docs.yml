name: Docs

# Builds the documentation site from docs/guide (tool/docs/generate.dart).
# Publishing to GitHub Pages is opt-in: enable Pages (source: GitHub Actions)
# and set the repository variable DOCS_PAGES=true.
on:
  push:
    branches: [main]
    paths: ["docs/guide/**", "parity.yaml", "tool/docs/**", "packages/daravel/test/docs/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart run tool/docs/generate.dart
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    if: vars.DOCS_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
