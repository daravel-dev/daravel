name: Release

# Creates the GitHub release for a pushed version tag, with the notes of
# that version from CHANGELOG.md (publishing to pub.dev is publish.yml).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

jobs:
  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            index($0, "## " ver) == 1 && (length($0) == length(ver) + 3 || substr($0, length(ver) + 4, 1) == " ") { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release $GITHUB_REF_NAME." > release_notes.md
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --notes-file release_notes.md --verify-tag $flags
          fi

      # Keep the release line branch on the latest release of its major
      # version while it has not diverged from main (see CONTRIBUTING.md).
      - name: Fast-forward the release line branch
        run: |
          major="${GITHUB_REF_NAME#v}"; major="${major%%.*}"
          branch="${major}.x"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "$branch"
            if git merge-base --is-ancestor "origin/$branch" "$GITHUB_SHA"; then
              git push origin "$GITHUB_SHA:refs/heads/$branch"
            else
              echo "$branch has diverged; not moving it."
            fi
          fi
