name: CI

# Pull requests are tested by their pull_request run only; a push run on a
# PR branch would test the same commit again and double the runners each
# update takes (macOS runners are the scarce ones). main and the release
# branches (1.x) are tested on push, and merge_group runs the checks for
# GitHub's merge queue once it is enabled in the repository rules.
on:
  push:
    branches: [main, "[0-9]+.x"]
  pull_request:
  merge_group:

# A new push to a pull request cancels its older run. Runs on main, the
# release branches and merge groups are never cancelled: they are the record
# that the commit which was merged or tagged passed.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }} / Dart ${{ matrix.sdk }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        sdk: [stable]
        include:
          - os: ubuntu-latest
            sdk: "3.13.0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The Changelog step compares a pull request with its base.
          fetch-depth: 2

      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Resolve workspace
        run: dart pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      # Blueprint #142 F2: the guide pages, one generated file each, say
      # every text exactly.
      - name: Docs up to date (parity table, compiled examples, guide pages)
        run: |
          dart run tool/docs/guide_pages_selftest.dart
          dart run tool/docs/generate.dart --check

      # Also: every `uses:` of publish.yml, release.yml and ci.yml pinned to
      # a commit SHA, and no cycle in the publish jobs' needs.
      - name: Every package has an example and a publish job after its dependencies
        run: |
          dart run tool/publish_checks_selftest.dart
          dart run tool/publish_checks.dart

      # Blueprint #136: every package has a sample app (or a planned one) and
      # apps/README.md is the generated matrix.
      - name: Sample applications
        run: |
          dart run tool/sample_apps_selftest.dart
          dart run tool/sample_apps_check.dart

      # `## Unreleased` stays on main; a new export needs an upgrade note.
      # On a pull request, HEAD is GitHub's merge commit and HEAD^1 the base;
      # in a merge queue, HEAD is the group's commit and HEAD^1 its base.
      - name: Changelog
        run: |
          dart run tool/changelog_selftest.dart
          case "${{ github.event_name }}" in pull_request|merge_group)
            dart run tool/changelog_check.dart --base=HEAD^1
            ;;
          *)
            dart run tool/changelog_check.dart --base=HEAD
            ;;
          esac

      # The example applications are what users copy, so they pass the same
      # lint rules as a user's project (no_inline_js_interpolation included).
      # Once, on Linux: the rules read source, the same on every OS.
      - name: Lint the example applications
        if: runner.os == 'Linux' && matrix.sdk == 'stable'
        run: |
          for app in apps/*/; do
            if [ -f "$app/bin/dartisan.dart" ]; then
              echo "== $app"
              (cd "$app" && dart run bin/dartisan.dart lint)
            fi
          done

      # The starter's generated regions match what its generators write now:
      # model accessors for the migrated schema, and form request inputs.
      # Once, on Linux: the output is the same on every OS.
      - name: Generated regions of the starter are up to date
        if: runner.os == 'Linux' && matrix.sdk == 'stable'
        working-directory: apps/daravel_starter
        env:
          APP_ENV: local
          DB_DATABASE: ${{ runner.temp }}/regions.sqlite
        run: |
          dart run bin/dartisan.dart migrate
          dart run bin/dartisan.dart model:sync --check
          dart run bin/dartisan.dart request:sync --check

      - name: Test (all packages)
        env:
          # `dartisan new` end-to-end (pub get + analyze + test of a generated
          # project) runs once, on Linux.
          DARAVEL_E2E: ${{ runner.os == 'Linux' && matrix.sdk == 'stable' && '1' || '0' }}
        # The oldest SDK (3.13.0) runs every suite where the result is kept
        # (merge queue, main, release branches); on a pull request only the
        # core's, as analyze above already checks the whole workspace on it.
        run: |
          if [ "${{ matrix.sdk }}" != stable ] && [ "${{ github.event_name }}" = pull_request ]; then
            echo "== packages/daravel (oldest SDK, pull request)"
            (cd packages/daravel && dart test --reporter=expanded)
            exit 0
          fi
          for pkg in packages/daravel packages/daravel_lints packages/daravel_lints_plugin packages/daravel_test packages/daravel_mysql packages/daravel_permission packages/daravel_activitylog packages/daravel_excel packages/daravel_log_viewer packages/daravel_pulse packages/daravel_horizon packages/daravel_reverb packages/daravel_reverb_client packages/daravel_payments packages/daravel_medialibrary packages/daravel_redis packages/daravel_sqlite packages/daravel_postgres packages/daravel_teorion packages/daravel_livekit packages/daravel_google packages/daravel_teobiefy packages/daravel_s3 packages/daravel_scout packages/daravel_session packages/dartisan_cli apps/daravel_starter apps/virtual_classroom apps/websocket_demo apps/cat_exam_demo apps/horizon_demo apps/reverb_demo; do
            if [ -d "$pkg/test" ]; then
              echo "== $pkg"
              (cd "$pkg" && dart test --reporter=expanded)
            fi
          done

      # The same suites again through a real ServerEngine socket instead of
      # Application.handle: dart:io's own behaviour (default headers, HEAD,
      # lengths, compression) is only visible there.
      - name: Test over a real socket
        if: matrix.sdk == 'stable'
        env:
          DARAVEL_TEST_TRANSPORT: socket
        run: |
          for pkg in packages/daravel packages/daravel_test apps/daravel_starter; do
            echo "== $pkg (socket)"
            (cd "$pkg" && dart test --reporter=expanded)
          done

      # daravel_reverb_client names the web as a platform: its crypto and the
      # library compiled to JavaScript, where integers are JavaScript numbers.
      # The files that need dart:io are @TestOn('vm'). Chrome is on GitHub's
      # Ubuntu runners; locally this takes about 45 s.
      - name: Test daravel_reverb_client in a browser
        if: runner.os == 'Linux' && matrix.sdk == 'stable'
        working-directory: packages/daravel_reverb_client
        run: dart test -p chrome --reporter=expanded

      - name: Verify pub.dev packaging (dry-run)
        if: runner.os == 'Linux' && matrix.sdk == 'stable'
        run: |
          for pkg in packages/daravel_lints packages/daravel_lints_plugin packages/daravel packages/daravel_test packages/daravel_mysql packages/daravel_permission packages/daravel_activitylog packages/daravel_excel packages/daravel_log_viewer packages/daravel_pulse packages/daravel_horizon packages/daravel_reverb packages/daravel_reverb_client packages/daravel_payments packages/daravel_medialibrary packages/daravel_redis packages/daravel_sqlite packages/daravel_postgres packages/daravel_teorion packages/daravel_livekit packages/daravel_google packages/daravel_teobiefy packages/daravel_s3 packages/daravel_scout packages/daravel_session packages/dartisan_cli; do
            echo "== $pkg"
            (cd "$pkg" && dart pub publish --dry-run)
          done

      # `dart build cli` (not `dart compile exe`): package:sqlite3 bundles
      # SQLite through a build hook, next to the executable.
      - name: Build AOT bundle
        working-directory: apps/daravel_starter
        run: dart build cli -t bin/server.dart -o build/server

      - name: Smoke test AOT bundle
        working-directory: apps/daravel_starter
        run: dart run tool/smoke.dart

  cross-build:
    # ADR-032 T3: a Linux bundle built on Windows, run on Linux by
    # cross-smoke. --no-sqlite: SQLite comes from the OS there.
    name: Build a Linux bundle on Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1

      - name: Resolve workspace
        run: dart pub get

      - name: dartisan build --target-os=linux
        working-directory: apps/daravel_starter
        run: dart run bin/dartisan.dart build --target-os=linux --no-sqlite --force

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: starter-linux-bundle
          path: apps/daravel_starter/build/server/bundle
          retention-days: 1

  cross-smoke:
    name: Run the Windows-built bundle on Linux
    needs: cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: starter-linux-bundle
          path: bundle

      # The bundle has no SQLite, and the smoke routes open no database. The
      # script is copied out of the workspace, so running it resolves no
      # packages and runs no build hooks. Artifacts lose the executable bit.
      - name: Smoke test the bundle
        run: |
          chmod +x bundle/bin/server
          cp apps/daravel_starter/tool/smoke.dart "$RUNNER_TEMP/smoke.dart"
          dart run "$RUNNER_TEMP/smoke.dart" bundle/bin/server

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: daravel
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: daravel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daravel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DARAVEL_TEST_PG: postgres://daravel:secret@127.0.0.1:5432/daravel_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1

      - name: Resolve workspace
        run: dart pub get

      - name: Test against PostgreSQL
        run: |
          (cd packages/daravel && dart test --tags integration --reporter=expanded)
          (cd packages/daravel && dart test test/notifications --reporter=expanded)
          (cd packages/dartisan_cli && dart test test/db_transfer_test.dart test/doctor_test.dart test/mcp_db_query_test.dart --reporter=expanded)
          (cd packages/daravel_permission && dart test --tags integration --reporter=expanded)
          (cd packages/daravel_activitylog && dart test --tags integration --reporter=expanded)
          (cd packages/daravel_teorion && dart test --tags integration --reporter=expanded)
          (cd packages/daravel_scout && dart test --tags integration --reporter=expanded)
          (cd packages/daravel_horizon && dart test --tags integration --reporter=expanded)

  redis:
    # Blueprint #41: Redis and Valkey on every commit.
    name: ${{ matrix.server }} integration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: ["redis:7", "valkey/valkey:8"]
    services:
      redis:
        image: ${{ matrix.server }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping || valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DARAVEL_TEST_REDIS: redis://127.0.0.1:6379/15
      DARAVEL_TEST_REDIS_CLUSTER: redis+cluster://127.0.0.1:17001,127.0.0.1:17002
      DARAVEL_TEST_REDIS_SENTINEL: redis+sentinel://127.0.0.1:17020/mymaster
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1

      - name: Resolve workspace
        run: dart pub get

      - name: Start a Sentinel and a Cluster of ${{ matrix.server }}
        run: sh packages/daravel_redis/tool/topologies.sh ${{ matrix.server }}

      - name: Test against ${{ matrix.server }}
        run: (cd packages/daravel_redis && dart test --tags integration --reporter=expanded)

  livekit:
    # Blueprint #48: the room service and join tokens against LiveKit.
    name: LiveKit integration
    runs-on: ubuntu-latest
    env:
      DARAVEL_TEST_LIVEKIT: http://127.0.0.1:7880
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1

      - name: Resolve workspace
        run: dart pub get

      - name: Start LiveKit in development mode (keys devkey / secret)
        run: |
          docker run -d --name livekit -p 127.0.0.1:7880:7880 livekit/livekit-server:v1.13.11 --dev --bind 0.0.0.0
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:7880/ && exit 0; sleep 1; done
          docker logs livekit; exit 1

      - name: Test against LiveKit
        run: (cd packages/daravel_livekit && dart test --tags integration --reporter=expanded)

  e2e:
    # Blueprint #46: the starter in a real browser and over HTTP, with the
    # Playwright suite `dartisan e2e:install` writes.
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Resolve workspace
        run: dart pub get

      - name: Install Playwright and Chromium
        working-directory: apps/daravel_starter/tests/e2e
        # The system libraries come from apt; when the runner's Ubuntu mirror
        # is down (azure.archive.ubuntu.com did not resolve for hours on
        # 2026-11-11, failing every run and so the merge queue), the browser
        # is installed alone: the ubuntu-latest image ships Google Chrome
        # and the libraries Chromium needs. A missing library still fails
        # the suite below, so nothing passes unchecked.
        run: |
          npm install --no-audit --no-fund
          if ! npx playwright install --with-deps chromium; then
            echo "::warning::apt failed; installing Chromium without its system dependencies"
            npx playwright install chromium
          fi

      - name: Run the suite (starts the starter on a fresh database)
        working-directory: apps/daravel_starter
        run: dart run bin/dartisan.dart test:e2e --serve

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: apps/daravel_starter/tests/e2e/report
          retention-days: 7

  s3:
    # Blueprint #52: the disk contract, multipart and presigned URLs on a real
    # S3-compatible server. RustFS rather than MinIO, whose images are no
    # longer published.
    name: S3 integration (RustFS)
    runs-on: ubuntu-latest
    env:
      DARAVEL_TEST_S3: http://127.0.0.1:9000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1

      - name: Resolve workspace
        run: dart pub get

      - name: Start RustFS (keys minioadmin / minioadmin)
        run: |
          docker run -d --name rustfs -p 127.0.0.1:9000:9000 -e RUSTFS_ACCESS_KEY=minioadmin -e RUSTFS_SECRET_KEY=minioadmin rustfs/rustfs:1.0.4 /data
          # 503 while it initialises, 403 (anonymous request) once it serves.
          for _ in $(seq 1 60); do [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/)" = 403 ] && exit 0; sleep 1; done
          docker logs rustfs; exit 1

      - name: Test against RustFS
        run: (cd packages/daravel_s3 && dart test --tags integration --reporter=expanded)

  mysql:
    # ADR-019: MySQL and MariaDB on every commit.
    name: ${{ matrix.server }} integration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: ["mysql:8.4", "mariadb:11"]
    services:
      db:
        image: ${{ matrix.server }}
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: daravel_test
          MYSQL_USER: daravel
          MYSQL_PASSWORD: secret
          MARIADB_ROOT_PASSWORD: secret
          MARIADB_DATABASE: daravel_test
          MARIADB_USER: daravel
          MARIADB_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -psecret || mariadb-admin ping -h 127.0.0.1 -psecret"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DARAVEL_TEST_MYSQL: mysql://daravel:secret@127.0.0.1:3306/daravel_test
      # Triggers need a user with SUPER while binary logging is on
      # (single_statement_test.dart).
      DARAVEL_TEST_MYSQL_ROOT: mysql://root:secret@127.0.0.1:3306/daravel_test
      DARAVEL_TEST_MARIADB: ${{ startsWith(matrix.server, 'mariadb') && '1' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1

      - name: Resolve workspace
        run: dart pub get

      # mysql_dart 4 verifies server certificates (B4): a second server with
      # a certificate a throwaway CA signed for `localhost` only, so
      # verify-full is tested both ways (mysql_tls_test.dart).
      - name: Start ${{ matrix.server }} with a test CA
        run: |
          tls="$RUNNER_TEMP/tls"
          mkdir -p "$tls" && cd "$tls"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -keyout ca-key.pem -out ca.pem -subj "/CN=Daravel CI test CA"
          openssl req -newkey rsa:2048 -nodes \
            -keyout server-key.pem -out server.csr -subj "/CN=localhost"
          printf 'subjectAltName=DNS:localhost\nbasicConstraints=CA:FALSE\nextendedKeyUsage=serverAuth\n' > server.ext
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca-key.pem \
            -CAcreateserial -days 2 -extfile server.ext -out server.pem
          chmod 644 ./*.pem
          docker run -d --name tlsdb -p 3307:3306 -v "$tls:/tls:ro" \
            -e MYSQL_ROOT_PASSWORD=secret -e MYSQL_DATABASE=daravel_test \
            -e MYSQL_USER=daravel -e MYSQL_PASSWORD=secret \
            -e MARIADB_ROOT_PASSWORD=secret -e MARIADB_DATABASE=daravel_test \
            -e MARIADB_USER=daravel -e MARIADB_PASSWORD=secret \
            ${{ matrix.server }} \
            --ssl-ca=/tls/ca.pem --ssl-cert=/tls/server.pem --ssl-key=/tls/server-key.pem
          for _ in $(seq 1 90); do
            docker exec tlsdb sh -c 'mysqladmin ping -h 127.0.0.1 -psecret || mariadb-admin ping -h 127.0.0.1 -psecret' >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec tlsdb sh -c 'mysqladmin ping -h 127.0.0.1 -psecret || mariadb-admin ping -h 127.0.0.1 -psecret' || { docker logs tlsdb; exit 1; }
          echo "DARAVEL_TEST_MYSQL_TLS=mysql://daravel:secret@localhost:3307/daravel_test" >> "$GITHUB_ENV"
          echo "DARAVEL_TEST_MYSQL_TLS_CA=$tls/ca.pem" >> "$GITHUB_ENV"

      - name: Test against ${{ matrix.server }}
        run: |
          (cd packages/daravel_mysql && dart test --tags integration --exclude-tags single-statement --reporter=expanded)
          # Timestamps come back without a zone: read them as UTC in any zone.
          (cd packages/daravel_mysql && TZ=Asia/Makassar dart test --tags integration --exclude-tags single-statement --reporter=expanded)
          # A process of its own: sharing one with the other files loaded
          # their timing-sensitive tests (#403).
          (cd packages/daravel_mysql && dart test test/single_statement_test.dart --reporter=expanded)
          (cd packages/daravel_permission && dart test --tags integration --reporter=expanded)
          (cd packages/daravel_activitylog && dart test --tags integration --reporter=expanded)
          (cd packages/daravel_teorion && dart test --tags integration --reporter=expanded)
          (cd packages/dartisan_cli && dart test test/db_transfer_test.dart test/doctor_test.dart test/mcp_db_query_test.dart --reporter=expanded)
