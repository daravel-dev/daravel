name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Dart ${{ matrix.sdk }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        sdk: [stable]
        include:
          - os: ubuntu-latest
            sdk: "3.13.0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Resolve workspace
        run: dart pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test (all packages)
        env:
          # `dartisan new` end-to-end (pub get + analyze + test of a generated
          # project) runs once, on Linux.
          DARAVEL_E2E: ${{ runner.os == 'Linux' && matrix.sdk == 'stable' && '1' || '0' }}
        run: |
          for pkg in packages/daravel packages/daravel_lints packages/daravel_test packages/dartisan_cli apps/daravel_starter; do
            if [ -d "$pkg/test" ]; then
              echo "== $pkg"
              (cd "$pkg" && dart test --reporter=expanded)
            fi
          done

      # `dart build cli` (not `dart compile exe`): package:sqlite3 bundles
      # SQLite through a build hook, next to the executable.
      - name: Build AOT bundle
        working-directory: apps/daravel_starter
        run: dart build cli -t bin/server.dart -o build/server

      - name: Smoke test AOT bundle
        working-directory: apps/daravel_starter
        run: dart run tool/smoke.dart
