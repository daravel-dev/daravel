name: Publish to pub.dev

# Automated publishing with GitHub OIDC (no stored credentials). One-time
# setup per package on pub.dev: Admin → Automated publishing → enable GitHub
# Actions for repository daravel-dev/daravel with tag pattern `v{{version}}`.
# Then push a tag such as `v1.0.1` to publish all ten packages in
# dependency order. Versions already on pub.dev are skipped, so re-running
# the workflow after a partly manual release publishes the rest.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  id-token: write
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    # Each package: `published` when this version is on pub.dev already (a
    # release partly published by hand), so its job is skipped and a re-run
    # of the workflow finishes the rest.
    outputs:
      daravel_lints: ${{ steps.published.outputs.daravel_lints }}
      daravel: ${{ steps.published.outputs.daravel }}
      daravel_test: ${{ steps.published.outputs.daravel_test }}
      daravel_mysql: ${{ steps.published.outputs.daravel_mysql }}
      daravel_sqlite: ${{ steps.published.outputs.daravel_sqlite }}
      daravel_postgres: ${{ steps.published.outputs.daravel_postgres }}
      dartisan_cli: ${{ steps.published.outputs.dartisan_cli }}
      daravel_teorion: ${{ steps.published.outputs.daravel_teorion }}
      daravel_permission: ${{ steps.published.outputs.daravel_permission }}
      daravel_activitylog: ${{ steps.published.outputs.daravel_activitylog }}
      daravel_redis: ${{ steps.published.outputs.daravel_redis }}
      daravel_livekit: ${{ steps.published.outputs.daravel_livekit }}
      daravel_google: ${{ steps.published.outputs.daravel_google }}
      daravel_teobiefy: ${{ steps.published.outputs.daravel_teobiefy }}
      daravel_s3: ${{ steps.published.outputs.daravel_s3 }}
      daravel_excel: ${{ steps.published.outputs.daravel_excel }}
      daravel_log_viewer: ${{ steps.published.outputs.daravel_log_viewer }}
      daravel_medialibrary: ${{ steps.published.outputs.daravel_medialibrary }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Tag matches daravelVersion
        run: |
          version=$(sed -n "s/^const String daravelVersion = '\(.*\)';/\1/p" packages/daravel/lib/src/foundation/version.dart)
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != v$version"; exit 1; }
      - run: dart analyze --fatal-infos
      - run: (cd packages/daravel && dart test)
      - name: Versions already on pub.dev
        id: published
        run: |
          version="${GITHUB_REF_NAME#v}"
          for package in daravel_lints daravel daravel_test daravel_mysql daravel_sqlite daravel_postgres dartisan_cli daravel_teorion daravel_permission daravel_activitylog daravel_redis daravel_livekit daravel_google daravel_teobiefy daravel_s3 daravel_excel daravel_log_viewer daravel_medialibrary; do
            status=$(curl -s -o /dev/null -w '%{http_code}' "https://pub.dev/api/packages/$package/versions/$version")
            if [ "$status" = "200" ]; then state=published; else state=pending; fi
            echo "$package $version: $state"
            echo "$package=$state" >> "$GITHUB_OUTPUT"
          done

  lints:
    needs: verify
    if: needs.verify.outputs.daravel_lints != 'published'
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/daravel_lints

  # `!failure() && !cancelled()`: a skipped (already published) dependency
  # does not stop the packages after it.
  daravel:
    needs: [verify, lints]
    if: ${{ !failure() && !cancelled() && needs.verify.outputs.daravel != 'published' }}
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/daravel

  daravel_test:
    needs: [verify, daravel]
    if: ${{ !failure() && !cancelled() && needs.verify.outputs.daravel_test != 'published' }}
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/daravel_test

  daravel_mysql:
    needs: [verify, daravel]
    if: ${{ !failure() && !cancelled() && needs.verify.outputs.daravel_mysql != 'published' }}
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/daravel_mysql

  daravel_sqlite:
    needs: [verify, daravel]
    if: ${{ !failure() && !cancelled() && needs.verify.outputs.daravel_sqlite != 'published' }}
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/daravel_sqlite

  daravel_postgres:
    needs: [verify, daravel]
    if: ${{ !failure() && !cancelled() && needs.verify.outputs.daravel_postgres != 'published' }}
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/daravel_postgres

  dartisan_cli:
    needs: [verify, daravel, daravel_mysql]
    if: ${{ !failure() && !cancelled() && needs.verify.outputs.dartisan_cli != 'published' }}
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/dartisan_cli

  daravel_teorion:
    needs: [verify, daravel]
    if: ${{ !failure() && !cancelled() && needs.verify.outputs.daravel_teorion != 'published' }}
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/daravel_teorion

  # The commands of these three build on dartisan_cli.
  daravel_permission:
    needs: [verify, daravel, dartisan_cli]
    if: ${{ !failure() && !cancelled() && needs.verify.outputs.daravel_permission != 'published' }}
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/daravel_permission

  daravel_activitylog:
    needs: [verify, daravel, dartisan_cli]
    if: ${{ !failure() && !cancelled() && needs.verify.outputs.daravel_activitylog != 'published' }}
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/daravel_activitylog

  daravel_redis:
    needs: [verify, daravel, dartisan_cli]
    if: ${{ !failure() && !cancelled() && needs.verify.outputs.daravel_redis != 'published' }}
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/daravel_redis

  daravel_livekit:
    needs: [verify, daravel]
    if: ${{ !failure() && !cancelled() && needs.verify.outputs.daravel_livekit != 'published' }}
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/daravel_livekit

  daravel_google:
    needs: [verify, daravel]
    if: ${{ !failure() && !cancelled() && needs.verify.outputs.daravel_google != 'published' }}
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/daravel_google

  daravel_teobiefy:
    needs: [verify, daravel]
    if: ${{ !failure() && !cancelled() && needs.verify.outputs.daravel_teobiefy != 'published' }}
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/daravel_teobiefy

  daravel_s3:
    needs: [verify, daravel]
    if: ${{ !failure() && !cancelled() && needs.verify.outputs.daravel_s3 != 'published' }}
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/daravel_s3

  daravel_excel:
    needs: [verify, daravel, dartisan_cli]
    if: ${{ !failure() && !cancelled() && needs.verify.outputs.daravel_excel != 'published' }}
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/daravel_excel

  daravel_log_viewer:
    needs: [verify, daravel]
    if: ${{ !failure() && !cancelled() && needs.verify.outputs.daravel_log_viewer != 'published' }}
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/daravel_log_viewer

  daravel_medialibrary:
    needs: [verify, daravel, dartisan_cli]
    if: ${{ !failure() && !cancelled() && needs.verify.outputs.daravel_medialibrary != 'published' }}
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/daravel_medialibrary
