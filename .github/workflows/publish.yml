name: Publish to pub.dev

# Automated publishing with GitHub OIDC (no stored credentials). One-time
# setup per package on pub.dev: Admin → Automated publishing → enable GitHub
# Actions for repository daravel-dev/daravel with tag pattern `v{{version}}`.
# Then push a tag such as `v1.0.1` to publish all ten packages in
# dependency order. Versions already on pub.dev are skipped, so re-running
# the workflow after a partly manual release publishes the rest.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    # Each package: `published` when this version is on pub.dev already (a
    # release partly published by hand), so its job is skipped and a re-run
    # of the workflow finishes the rest.
    outputs:
      daravel_lints: ${{ steps.published.outputs.daravel_lints }}
      daravel: ${{ steps.published.outputs.daravel }}
      daravel_test: ${{ steps.published.outputs.daravel_test }}
      daravel_mysql: ${{ steps.published.outputs.daravel_mysql }}
      daravel_sqlite: ${{ steps.published.outputs.daravel_sqlite }}
      daravel_postgres: ${{ steps.published.outputs.daravel_postgres }}
      dartisan_cli: ${{ steps.published.outputs.dartisan_cli }}
      daravel_teorion: ${{ steps.published.outputs.daravel_teorion }}
      daravel_permission: ${{ steps.published.outputs.daravel_permission }}
      daravel_activitylog: ${{ steps.published.outputs.daravel_activitylog }}
      daravel_redis: ${{ steps.published.outputs.daravel_redis }}
      daravel_livekit: ${{ steps.published.outputs.daravel_livekit }}
      daravel_google: ${{ steps.published.outputs.daravel_google }}
      daravel_teobiefy: ${{ steps.published.outputs.daravel_teobiefy }}
      daravel_s3: ${{ steps.published.outputs.daravel_s3 }}
      daravel_scout: ${{ steps.published.outputs.daravel_scout }}
      daravel_session: ${{ steps.published.outputs.daravel_session }}
      daravel_excel: ${{ steps.published.outputs.daravel_excel }}
      daravel_log_viewer: ${{ steps.published.outputs.daravel_log_viewer }}
      daravel_pulse: ${{ steps.published.outputs.daravel_pulse }}
      daravel_payments: ${{ steps.published.outputs.daravel_payments }}
      daravel_medialibrary: ${{ steps.published.outputs.daravel_medialibrary }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Tag matches daravelVersion
        run: |
          version=$(sed -n "s/^const String daravelVersion = '\(.*\)';/\1/p" packages/daravel/lib/src/foundation/version.dart)
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != v$version"; exit 1; }
      - run: dart analyze --fatal-infos
      - run: (cd packages/daravel && dart test)
      - name: Versions already on pub.dev
        id: published
        run: |
          version="${GITHUB_REF_NAME#v}"
          for package in daravel_lints daravel daravel_test daravel_mysql daravel_sqlite daravel_postgres dartisan_cli daravel_teorion daravel_permission daravel_activitylog daravel_redis daravel_livekit daravel_google daravel_teobiefy daravel_s3 daravel_scout daravel_session daravel_excel daravel_log_viewer daravel_pulse daravel_payments daravel_medialibrary; do
            status=$(curl -s -o /dev/null -w '%{http_code}' "https://pub.dev/api/packages/$package/versions/$version")
            if [ "$status" = "200" ]; then state=published; else state=pending; fi
            echo "$package $version: $state"
            echo "$package=$state" >> "$GITHUB_OUTPUT"
          done

  # One job, one package after the other in dependency order, from this
  # checkout: no artifact passes between jobs. setup-dart's reusable
  # workflow (one call per package) shares one artifact name across a
  # run, so parallel calls published each other's archives in 1.27.1, and
  # a re-run's download takes an older attempt's archive. A step that fails
  # stops the ones after it; a re-run skips what is on pub.dev already.
  # This job holds the OIDC token and runs no package code: only
  # `dart pub get` and `dart pub publish`. Tests and analysis run in
  # `verify`, which has no `id-token`.
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Creates the pub.dev token from the job's OIDC token (PUB_TOKEN,
      # `dart pub token add https://pub.dev --env-var PUB_TOKEN`).
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1
        with:
          sdk: stable
      - run: dart pub get
      - name: daravel_lints
        if: needs.verify.outputs.daravel_lints != 'published'
        working-directory: packages/daravel_lints
        run: dart pub publish --force
      - name: daravel
        if: needs.verify.outputs.daravel != 'published'
        working-directory: packages/daravel
        run: dart pub publish --force
      - name: daravel_test
        if: needs.verify.outputs.daravel_test != 'published'
        working-directory: packages/daravel_test
        run: dart pub publish --force
      - name: daravel_mysql
        if: needs.verify.outputs.daravel_mysql != 'published'
        working-directory: packages/daravel_mysql
        run: dart pub publish --force
      - name: daravel_sqlite
        if: needs.verify.outputs.daravel_sqlite != 'published'
        working-directory: packages/daravel_sqlite
        run: dart pub publish --force
      - name: daravel_postgres
        if: needs.verify.outputs.daravel_postgres != 'published'
        working-directory: packages/daravel_postgres
        run: dart pub publish --force
      - name: dartisan_cli
        if: needs.verify.outputs.dartisan_cli != 'published'
        working-directory: packages/dartisan_cli
        run: dart pub publish --force
      - name: daravel_teorion
        if: needs.verify.outputs.daravel_teorion != 'published'
        working-directory: packages/daravel_teorion
        run: dart pub publish --force
      - name: daravel_permission
        if: needs.verify.outputs.daravel_permission != 'published'
        working-directory: packages/daravel_permission
        run: dart pub publish --force
      - name: daravel_activitylog
        if: needs.verify.outputs.daravel_activitylog != 'published'
        working-directory: packages/daravel_activitylog
        run: dart pub publish --force
      - name: daravel_livekit
        if: needs.verify.outputs.daravel_livekit != 'published'
        working-directory: packages/daravel_livekit
        run: dart pub publish --force
      - name: daravel_google
        if: needs.verify.outputs.daravel_google != 'published'
        working-directory: packages/daravel_google
        run: dart pub publish --force
      - name: daravel_teobiefy
        if: needs.verify.outputs.daravel_teobiefy != 'published'
        working-directory: packages/daravel_teobiefy
        run: dart pub publish --force
      - name: daravel_s3
        if: needs.verify.outputs.daravel_s3 != 'published'
        working-directory: packages/daravel_s3
        run: dart pub publish --force
      - name: daravel_scout
        if: needs.verify.outputs.daravel_scout != 'published'
        working-directory: packages/daravel_scout
        run: dart pub publish --force
      - name: daravel_session
        if: needs.verify.outputs.daravel_session != 'published'
        working-directory: packages/daravel_session
        run: dart pub publish --force
      - name: daravel_redis
        if: needs.verify.outputs.daravel_redis != 'published'
        working-directory: packages/daravel_redis
        run: dart pub publish --force
      - name: daravel_excel
        if: needs.verify.outputs.daravel_excel != 'published'
        working-directory: packages/daravel_excel
        run: dart pub publish --force
      - name: daravel_log_viewer
        if: needs.verify.outputs.daravel_log_viewer != 'published'
        working-directory: packages/daravel_log_viewer
        run: dart pub publish --force
      - name: daravel_pulse
        if: needs.verify.outputs.daravel_pulse != 'published'
        working-directory: packages/daravel_pulse
        run: dart pub publish --force
      - name: daravel_payments
        if: needs.verify.outputs.daravel_payments != 'published'
        working-directory: packages/daravel_payments
        run: dart pub publish --force
      - name: daravel_medialibrary
        if: needs.verify.outputs.daravel_medialibrary != 'published'
        working-directory: packages/daravel_medialibrary
        run: dart pub publish --force
