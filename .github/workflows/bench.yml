name: Benchmarks

# BLUEPRINT_V2 §10.2 / §11.2: nightly benchmark on Linux. Throughput is
# compared relative to a plain dart:io server measured in the same job, so
# the > 10% regression gate does not depend on the runner's hardware.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      duration:
        description: Seconds per scenario
        default: "10"

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Scenarios 2–4 and 11 again on PostgreSQL. A throwaway server for this
    # job; the harness skips the PostgreSQL run when it does not answer.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bench
          POSTGRES_PASSWORD: bench
          POSTGRES_DB: bench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bench"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Resolve workspace
        run: dart pub get

      - name: Run benchmarks
        working-directory: bench
        run: |
          args="--duration=${{ github.event.inputs.duration || '10' }} --isolates=1,4 --out=results.json"
          if [ -f baseline.json ]; then args="$args --compare=baseline.json"; fi
          dart run bin/bench.dart $args

      - name: Run PostgreSQL variants
        working-directory: bench
        run: |
          dart run bin/bench.dart --skip-build \
            --database='postgres://bench:bench@127.0.0.1:5432/bench?pool=4' \
            --scenarios=2,3,4,11 --isolates=1,4 \
            --duration=${{ github.event.inputs.duration || '10' }} \
            --out=results-pgsql.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.run_number }}
          path: |
            bench/results.json
            bench/results-pgsql.json
          if-no-files-found: ignore
