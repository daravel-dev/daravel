name: daravel_workspace
description: Daravel monorepo workspace (framework core, CLI, testing toolkit, starter app).
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - packages/daravel
  - packages/daravel_test
  - packages/daravel_lints
  - packages/dartisan_cli
  - packages/daravel_mysql
  - packages/daravel_redis
  - packages/daravel_sqlite
  - packages/daravel_permission
  - packages/daravel_activitylog
  - packages/daravel_excel
  - packages/daravel_log_viewer
  - packages/daravel_postgres
  - packages/daravel_teorion
  - packages/daravel_google
  - packages/daravel_teobiefy
  - packages/daravel_livekit
  - packages/daravel_s3
  - apps/daravel_starter
  - bench

dev_dependencies:
  crypto: ^3.0.7
  markdown: ^7.3.0
  yaml: ^3.1.3
