name: daravel_teobiefy
description: teobiefy for Daravel. Encrypted API payloads compatible with teobiefy's protocol v1 on Laravel - X25519 session handshake (libsodium crypto_kx) and ChaCha20-Poly1305 IETF.
version: 1.20.1
homepage: https://daravel.dev
repository: https://github.com/daravel-dev/daravel/tree/main/packages/daravel_teobiefy
issue_tracker: https://github.com/daravel-dev/daravel/issues
funding:
  - https://github.com/sponsors/daravel-dev
documentation: https://daravel.dev/teobiefy.html
topics: [encryption, libsodium, chacha20, x25519, backend]

platforms:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  cryptography: ^2.9.0
  daravel: ^1.20.1

dev_dependencies:
  daravel_test: ^1.20.1
  test: ^1.33.0
