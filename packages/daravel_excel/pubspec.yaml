name: daravel_excel
description: Excel and CSV exports and imports for Daravel, streamed with constant memory. Laravel Excel's concerns, validated imports with row numbers, downloads and disks.
version: 1.22.0
homepage: https://daravel.dev
repository: https://github.com/daravel-dev/daravel/tree/main/packages/daravel_excel
issue_tracker: https://github.com/daravel-dev/daravel/issues
funding:
  - https://github.com/sponsors/daravel-dev
documentation: https://daravel.dev/excel.html
topics: [excel, xlsx, csv, spreadsheet, server]

platforms:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  args: ^2.6.0
  daravel: ^1.22.0
  dartisan_cli: ^1.22.0
  path: ^1.9.0
  xml: ^7.0.0

dev_dependencies:
  daravel_mysql: ^1.22.0
  test: ^1.33.0
