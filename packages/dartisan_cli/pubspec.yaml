name: dartisan_cli
description: dartisan, the Daravel command-line interface. Creates projects, runs the dev server with hot reload, generators, migrations, queues and native builds.
version: 1.17.0
homepage: https://daravel.dev
repository: https://github.com/daravel-dev/daravel/tree/main/packages/dartisan_cli
issue_tracker: https://github.com/daravel-dev/daravel/issues
funding:
  - https://github.com/sponsors/daravel-dev
documentation: https://daravel.dev
topics: [cli, codegen, server, backend, openapi]

platforms:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.13.0
resolution: workspace

executables:
  dartisan: dartisan

dependencies:
  args: ^2.6.0
  daravel: ^1.17.0
  daravel_mysql: ^1.17.0
  daravel_lints: ^1.17.0
  path: ^1.9.1
  vm_service: ^15.4.0
  watcher: ^1.2.1
  crypto: ^3.0.7

dev_dependencies:
  lints: ^6.0.0
  sqlite3: ^3.8.0
  test: ^1.33.0
