name: daravel_permission
description: Roles and permissions in the database for Daravel, on spatie/laravel-permission's tables, with middleware, gate integration and an in-memory cache.
version: 1.15.0
homepage: https://daravel.dev
repository: https://github.com/daravel-dev/daravel/tree/main/packages/daravel_permission
issue_tracker: https://github.com/daravel-dev/daravel/issues
documentation: https://daravel.dev/permissions.html
topics: [rbac, permissions, authorization, server, backend]

platforms:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  args: ^2.6.0
  daravel: ^1.15.0
  dartisan_cli: ^1.15.0

dev_dependencies:
  daravel_mysql: ^1.15.0
  test: ^1.33.0
