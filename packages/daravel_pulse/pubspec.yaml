name: daravel_pulse
description: An observability dashboard for Daravel, after Laravel Pulse. Requests, slow requests and queries, exceptions, queues and jobs across every worker isolate, with no external service.
version: 1.18.1
homepage: https://daravel.dev
repository: https://github.com/daravel-dev/daravel/tree/main/packages/daravel_pulse
issue_tracker: https://github.com/daravel-dev/daravel/issues
funding:
  - https://github.com/sponsors/daravel-dev
documentation: https://daravel.dev/pulse.html
topics: [monitoring, observability, dashboard, performance, server]

platforms:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  daravel: ^1.18.1

dev_dependencies:
  daravel_test: ^1.18.1
  test: ^1.33.0
