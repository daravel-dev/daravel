name: daravel_log_viewer
description: A log viewer page for Daravel. Reads log files from their end in constant memory, filters and follows them live, masks secrets. Daravel and Laravel log formats.
version: 1.21.0
homepage: https://daravel.dev
repository: https://github.com/daravel-dev/daravel/tree/main/packages/daravel_log_viewer
issue_tracker: https://github.com/daravel-dev/daravel/issues
funding:
  - https://github.com/sponsors/daravel-dev
documentation: https://daravel.dev/log-viewer.html
topics: [logging, logs, observability, dashboard, server]

platforms:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  daravel: ^1.21.0
  path: ^1.9.0

dev_dependencies:
  test: ^1.33.0
