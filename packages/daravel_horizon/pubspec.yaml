name: daravel_horizon
description: Queue supervisors for Daravel after Laravel Horizon. Worker isolates per supervisor, auto-scaling on queue load, and a dashboard, with the jobs table shared with Laravel.
version: 1.27.5
homepage: https://daravel.dev
repository: https://github.com/daravel-dev/daravel/tree/main/packages/daravel_horizon
issue_tracker: https://github.com/daravel-dev/daravel/issues
funding:
  - https://github.com/sponsors/daravel-dev
documentation: https://daravel.dev/horizon.html
topics: [queue, jobs, monitoring, dashboard, server]

platforms:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  daravel: ^1.27.5
  dartisan_cli: ^1.27.5

dev_dependencies:
  args: ^2.6.0
  daravel_mysql: ^1.27.5
  daravel_redis: ^1.27.5
  daravel_session: ^1.27.5
  daravel_test: ^1.27.5
  path: ^1.9.0
  test: ^1.33.0
