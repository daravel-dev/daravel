name: daravel
description: A Laravel-inspired, AOT-native backend framework for Dart with routing, validation, an ORM, auth, queues and Laravel-compatible wire formats.
version: 1.19.1
homepage: https://daravel.dev
repository: https://github.com/daravel-dev/daravel/tree/main/packages/daravel
issue_tracker: https://github.com/daravel-dev/daravel/issues
funding:
  - https://github.com/sponsors/daravel-dev
documentation: https://daravel.dev
topics: [server, backend, framework, http, orm]

platforms:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  collection: ^1.19.1
  crypto: ^3.0.7
  cryptography: ^2.9.0
  ffi: ^2.1.0
  meta: ^1.16.0
  mime: ^2.1.0
  markdown: ^7.3.0
  path: ^1.9.0
  postgres: ^3.5.20
  sqlite3: ^3.8.0
  timezone: ^0.11.2
  uuid: ^4.6.0

dev_dependencies:
  analyzer: ^14.6.0
  bcrypt: ^1.2.0
  daravel_lints: ^1.19.1
  daravel_test: ^1.19.1
  lints: ^6.0.0
  test: ^1.33.0
  yaml: ^3.1.3
