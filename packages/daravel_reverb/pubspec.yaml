name: daravel_reverb
description: A Pusher-protocol WebSocket server of its own for Daravel, after Laravel Reverb. Several applications, restarts that spread reconnects, and stats per isolate.
version: 1.27.4
homepage: https://daravel.dev
repository: https://github.com/daravel-dev/daravel/tree/main/packages/daravel_reverb
issue_tracker: https://github.com/daravel-dev/daravel/issues
funding:
  - https://github.com/sponsors/daravel-dev
documentation: https://daravel.dev/broadcasting.html
topics: [websocket, pusher, broadcasting, realtime, server]

platforms:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  args: ^2.6.0
  daravel: ^1.27.4
  dartisan_cli: ^1.27.4

dev_dependencies:
  daravel_reverb_client: ^1.27.4
  daravel_test: ^1.27.4
  test: ^1.33.0
  web_socket_channel: ^3.0.3
